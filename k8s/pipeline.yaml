apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: geotiff-processing-template
spec:
  ttlStrategy:
    secondsAfterCompletion: 600
    secondsAfterSuccess: 15
  podGC:
    strategy: OnPodCompletion
  volumeClaimGC:
    strategy: OnWorkflowCompletion
  entrypoint: entry
  onExit: exit-handler
  arguments:
    parameters:
      - name: s3-path
      - name: filename
      - name: bucket
      - name: key
      - name: id
      - name: uuid
      - name: state
      - name: stacurl
      - name: awsurl
      - name: fronturl

  volumeClaimTemplates:
    - metadata:
        name: workspace-{{workflow.name}}
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 60Gi # Seems to be just enough for a 5gb file

  templates:
    - name: entry
      dag:
        tasks:
          - name: download
            template: s3-download
            hooks:
              running:
                expression: "true"
                template: report-status
                arguments:
                  parameters:
                    - name: step-id
                      value: "Downloading"
                    - name: message
                      value: "Downloading file from S3..."

          - name: validate
            depends: "download.Succeeded"
            template: validate-geotiff
            hooks:
              running:
                expression: "true"
                template: report-status
                arguments:
                  parameters:
                    - name: step-id
                      value: "Validation"
                    - name: message
                      value: "Validated GeoTIFF integrity"

          - name: convert-to-cog
            depends: "validate.Succeeded"
            template: rio-cogeo-convert
            hooks:
              running:
                expression: "true"
                template: report-status
                arguments:
                  parameters:
                    - name: step-id
                      value: "Converting"
                    - name: message
                      value: "Converting file to Cloud Optimized GeoTIFF (COG)..."

          - name: extract-metadata
            depends: "validate.Succeeded"
            template: get-metadata

          - name: upload
            depends: "convert-to-cog.Succeeded"
            template: s3-upload
            hooks:
              running:
                expression: "true"
                template: report-status
                arguments:
                  parameters:
                    - name: step-id
                      value: "Uploading"
                    - name: message
                      value: "Uploading final COG to S3 storage..."

          - name: upload-meta
            depends: "extract-metadata.Succeeded"
            template: meta-upload

          - name: register-stac
            depends: "upload-meta.Succeeded && upload.Succeeded"
            template: register-stac
            hooks:
              running:
                expression: "true"
                template: report-status
                arguments:
                  parameters:
                    - name: step-id
                      value: "Registering"
                    - name: message
                      value: "Registering COG with STAC catalog..."

          - name: cleanup-on-failure
            depends: "validate.Failed"
            when: "{{tasks.validate.exitCode}} == 5 || {{tasks.validate.exitCode}} == 6 || {{tasks.validate.exitCode}} == 7"
            template: cleanup
            arguments:
              parameters:
                - name: val-exit-code
                  value: "{{tasks.validate.exitCode}}"
    - name: exit-handler
      steps:
        - - name: report-success
            template: report-status
            when: "{{workflow.status}} == Succeeded"
            arguments:
              parameters:
                - name: step-id
                  value: "Succeeded"
                - name: message
                  value: "Processing finished successfully."
          - name: report-failure
            template: report-status
            when: "{{workflow.status}} != Succeeded"
            arguments:
              parameters:
                - name: step-id
                  value: "Failed"
                - name: message
                  value: "Workflow ended with a failure or was interrupted."

    - name: s3-download
      container:
        image: amazon/aws-cli:latest
        env:
          - name: AWS_ACCESS_KEY_ID
            value: test
          - name: AWS_SECRET_ACCESS_KEY
            value: test
          - name: AWS_DEFAULT_REGION
            value: us-east-1
        command: [sh, -c]
        args:
          - >
            df -h /data &&
            rm -rf /data/* &&
            df -h /data &&
            aws --endpoint-url={{workflow.parameters.awsurl}} s3 cp {{workflow.parameters.s3-path}}{{workflow.parameters.filename}} /data/input.tif &&
            aws --endpoint-url={{workflow.parameters.awsurl}} s3api head-object --bucket {{workflow.parameters.bucket}}  --key {{workflow.parameters.key}} --query 'Metadata' > /data/meta.json
        volumeMounts:
          - name: workspace-{{workflow.name}}
            mountPath: /data
      retryStrategy:
        limit: "3"
        retryPolicy: "OnFailure"

    - name: validate-geotiff
      container:
        image: validate:v1
        env:
          - name: GDAL_CACHEMAX
            value: "4096"
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
          limits:
            memory: "6Gi"
            cpu: "4"
        imagePullPolicy: Never
        command: [python, script.py]
        args: 
          - "/data/input.tif"
        volumeMounts:
          - name: workspace-{{workflow.name}}
            mountPath: /data

    - name: rio-cogeo-convert
      container:
        image: convert:v1
        env:
          - name: GDAL_CACHEMAX
            value: "4096"
          - name: TMPDIR
            value: "/data/tmp"
        resources:
          requests:
            memory: "8Gi"
            cpu: "2"
          limits:
            memory: "12Gi"
            cpu: "4"
        imagePullPolicy: Never
        command: [sh, -c]
        args:
          - |
            mkdir -p /data/tmp
            df -h /data
            du -h -d 1 /data || true
            python script.py /data/input.tif /data/output.tif
            df -h /data
        volumeMounts:
          - name: workspace-{{workflow.name}}
            mountPath: /data
      retryStrategy:
        limit: "3"
        retryPolicy: "OnFailure"

    - name: get-metadata
      container:
        image: metadata:v1
        imagePullPolicy: Never
        command: [python, script.py]
        args: 
          - "/data/input.tif"
          - "/data/meta.json"
          - "/data/"
          - "{{workflow.parameters.id}}"
          - "{{workflow.parameters.bucket}}/{{workflow.parameters.key}}"
          - "{{workflow.parameters.externalaws}}"
          - "{{workflow.parameters.uuid}}"
        volumeMounts:
          - name: workspace-{{workflow.name}}
            mountPath: /data
      retryStrategy:
        limit: "3"
        retryPolicy: "OnFailure"

    - name: s3-upload
      container:
        image: amazon/aws-cli:latest
        env:
          - name: AWS_ACCESS_KEY_ID
            value: test
          - name: AWS_SECRET_ACCESS_KEY
            value: test
          - name: AWS_DEFAULT_REGION
            value: us-east-1
        command: [sh, -c]
        args:
          - >
            aws --endpoint-url={{workflow.parameters.awsurl}} s3 cp /data/output.tif {{workflow.parameters.s3-path}}cog-{{workflow.parameters.filename}} &
            rm -f /data/input.tif /data/output.tif &&
            rm -rf /data/tmp/*
        volumeMounts:
          - name: workspace-{{workflow.name}}
            mountPath: /data
      retryStrategy:
        limit: "3"
        retryPolicy: "OnFailure"

    - name: meta-upload
      container:
        image: amazon/aws-cli:latest
        env:
          - name: AWS_ACCESS_KEY_ID
            value: test
          - name: AWS_SECRET_ACCESS_KEY
            value: test
          - name: AWS_DEFAULT_REGION
            value: us-east-1
        command: [sh, -c]
        args:
          - >
            aws --endpoint-url={{workflow.parameters.awsurl}} s3 cp /data/metadata.json {{workflow.parameters.s3-path}}metadata.json &&
            aws --endpoint-url={{workflow.parameters.awsurl}} s3 cp /data/thumbnail.png {{workflow.parameters.s3-path}}thumbnail.png
        volumeMounts:
          - name: workspace-{{workflow.name}}
            mountPath: /data
      retryStrategy:
        limit: "3"
        retryPolicy: "OnFailure"
    
    - name: register-stac
      container:
        image: stac:v1
        imagePullPolicy: Never
        env:
          - name: STAC_URL
            value: "{{workflow.parameters.stacurl}}"
        command: [python, script.py]
        args: 
          - "/data/metadata.json"
        volumeMounts:
          - name: workspace-{{workflow.name}}
            mountPath: /data
      retryStrategy:
        limit: "3"
        retryPolicy: "OnFailure"
    - name: cleanup
      inputs:
        parameters:
          - name: val-exit-code
      container:
        image: amazon/aws-cli:latest
        env:
          - name: AWS_ACCESS_KEY_ID
            value: test
          - name: AWS_SECRET_ACCESS_KEY
            value: test
          - name: AWS_DEFAULT_REGION
            value: us-east-1
        command: [sh, -c]
        args: 
          - |
            # Generated with LLM
            # 1. Recursive S3 Deletion
            echo "Cleaning up S3 path: {{workflow.parameters.s3-path}}"
            aws --endpoint-url={{workflow.parameters.awsurl}} s3 rm {{workflow.parameters.s3-path}} --recursive
            
            # 2. Determine the specific error message
            CODE="{{inputs.parameters.val-exit-code}}"
            MSG="Validation failed due to an unknown error."
            
            if [ "$CODE" = "5" ]; then MSG="TIF is invalid (not georeferenced)!"; fi
            if [ "$CODE" = "6" ]; then MSG="TIF is invalid (too many bands, only < 3 accepted)!"; fi
            if [ "$CODE" = "7" ]; then MSG="TIF is invalid (bit depth must be 8 bits)!"; fi
            
            # 3. Write JSON to a temporary file to avoid quoting/shell hell
            # We use a heredoc to build the JSON safely
            cat <<EOF > /tmp/payload.json
            {
              "id": "{{workflow.parameters.id}}",
              "status": "Failed",
              "message": "$MSG"
            }
            EOF
            
            # 4. POST the file content
            curl -X POST {{workflow.parameters.fronturl}}/api/v1/workflowstatus \
            -H "Content-Type: application/json" \
            -H "X-Internal-Token: {{workflow.parameters.state}}" \
            -d @/tmp/payload.json
            
            # 5. Ensure the pod exits with a failure code so Argo knows it failed
            exit 1

    - name: report-status
      inputs:
        parameters:
          - name: step-id
          - name: message
      container:
        image: curlimages/curl:latest
        command: ["sh", "-c"]
        args:
          - |
            curl -X POST {{workflow.parameters.fronturl}}/api/v1/workflowstatus \
            -H "Content-Type: application/json" \
            -H "X-Internal-Token: {{workflow.parameters.state}}" \
            -d "{
              \"id\": \"{{workflow.parameters.id}}\",
              \"status\": \"{{inputs.parameters.step-id}}\",
              \"message\": \"{{inputs.parameters.message}}\"
            }"