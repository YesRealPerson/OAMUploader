# Generated with an LLM
apiVersion: v1
kind: ServiceAccount
metadata:
  name: front-api-sa
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workflow-manager-global
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows", "workflowtemplates"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: front-api-global-binding
subjects:
  - kind: ServiceAccount
    name: front-api-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: workflow-manager-global
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front-api
  template:
    metadata:
      labels:
        app: front-api
    spec:
      serviceAccountName: front-api-sa
      hostAliases:
      - ip: "172.26.80.1"
        hostnames:
        - "aws"
      containers:
      - name: front
        image: oam-uploader-front:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 12345
        env:
          - name: STAC_URL
            value: "http://stac-api:8082"
          - name: AWS_ENDPOINT_URL
            value: "http://aws:4566"
          - name: AWS_ENDPOINT_URL_S3
            value: "http://aws:4566"
          - name: EXTERNAL_S3_ENDPOINT
            value: "http://localhost:4566"
          - name: BUCKET_NAME
            value: "testbucket"
          - name: AWS_REGION
            value: us-east-1
          - name: PRODUCTION
            value: "true"
          - name: REDIRECT_URI
            value: http://127.0.0.1:12345/api/v1/authorize
          - name: AUTHORIZE_URL
            value: https://www.openstreetmap.org/oauth2/authorize
          - name: TOKEN_URL
            value: https://www.openstreetmap.org/oauth2/token
          - name: WF_FRONT_URL
            value: http://front-api.default.svc.cluster.local:12345
          - name: WF_AWS_URL
            value: http://172.22.48.1:4566
          - name: WF_STAC_URL
            value: http://stac-api.default.svc.cluster.local:8082
        envFrom:
        - secretRef:
          name: keys
---
apiVersion: v1
kind: Service
metadata:
  name: front-api
  namespace: default
spec:
  selector:
    app: front-api
  ports:
    - protocol: TCP
      port: 12345
      targetPort: 12345